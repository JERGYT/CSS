<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Almacenamiento</title>
</head>

<body>
    <h1>Ejemplo de Almacenamiento en Front</h1>
    <form name="multiplicarForm">
        <fieldset>
            <legend>Multiplicar:</legend>
            <input type="number" name="factor1" required>
            <b>X</b>
            <input type="number" name="factor2" required>
            <button type="submit">Calcular</button>
        </fieldset>
    </form>
    <h2 id="resultado"></h2>


    <button id="verLOg">Ver log</button>
    <div id="historialLog">
        <table>
            <thead>
                <tr>
                    <th>Factor 1</th>
                    <th>Factor 2</th>
                    <th>Resultado</th>
                </tr>
            </thead>
            <tbody id="historial">
            </tbody>
        </table>
        <button type="button">Ocultar</button>
    </div>





    <script src="js/local.js"></script>
</body>

</html>
